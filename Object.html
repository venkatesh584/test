<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping</title>
    <script
      src="https://code.jquery.com/jquery-3.6.0.js "
      type="text/javascript"
    ></script>
    <style>
      body {
        background-color: aliceblue;
      }
      .main-container {
        max-width: 800px;
        background-color: white;
        margin: auto;
        margin-top: 50px;
        border-radius: 10px;
        height: auto;
        box-shadow: 0 0px 8px black;
      }
      h3 {
        text-align: center;
        color: green;
      }
      .para {
        padding-left: 10px;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .semi-container {
        display: flex;
        justify-content: left;
      }
      .contain {
        display: flex;
        justify-content: space-between;
        border: 1px solid black;
        border-radius: 5px;
        margin: 0 10px 10px 10px;
        flex-wrap: wrap;
      }
      button {
        background-color: rgb(27, 148, 189);
        color: white;
        border-radius: 5px;
        border: none;
        margin: 5px;
        padding: 5px;
        cursor: pointer;
      }
      span {
        margin-left: 10px;
        padding-top: 7px;
      }
      .addcart {
        display: flex;
        justify-content: right;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <h3>Online Shopping</h3>
      <p class="para">Available Products</p>
      <div id="dedupe"></div>
      <div>
        <p class="para">My Cart</p>
        <div id="cartt"></div>
        <p style="text-align: right" id="Price">Total Amount: Rs. 0</p>
        <p class="para">Action</p>
        <button>Sort Cart By Price</button>
        <button onclick="reSet()">Clear Cart</button>
      </div>
    </div>
    <script src="ObjectScriptss.js"></script>
  </body>
</html>
<!-- Latarry Game Code END-->
